name: Refresh AI Capex daily

on:
  schedule:
    - cron: "18 18 * * *"
  workflow_dispatch:

concurrency:
  group: level-grind-aidc-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Check out production source
        uses: actions/checkout@v5
        with:
          ref: production

      - name: Use supported Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch and verify Epoch AI public data
        run: npm run aidc:refresh

      - name: Build portable release with refreshed data
        run: npm run edgeone-demo:build

      - name: Verify AI Capex contract and UI
        run: node --test tests/aidc-capex-sync.test.mjs tests/ai-capex.test.mjs

      - name: Deploy refreshed public snapshot
        if: env.EDGEONE_API_TOKEN != ''
        run: npx edgeone makers deploy deploy/edgeone-demo/dist -n level-grind-hk-demo -t "$EDGEONE_API_TOKEN" -e production

      - name: Report missing deployment credential
        if: env.EDGEONE_API_TOKEN == ''
        run: echo "::error::AI Capex refreshed and validated, but EDGEONE_API_TOKEN is unavailable."
